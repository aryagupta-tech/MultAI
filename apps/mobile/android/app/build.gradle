apply plugin: 'com.android.application'

// Stable identity: application id, version and the private release key. The key and its passwords are
// read from a properties file outside the repository (MULTAI_ANDROID_SIGNING, default
// ~/.multai/android/keystore.properties); without it, release builds stop instead of signing with a
// throwaway key.
def versionProps = new Properties()
file('../../version.properties').withInputStream { versionProps.load(it) }
def signingFile = new File(System.getenv('MULTAI_ANDROID_SIGNING') ?: "${System.getProperty('user.home')}/.multai/android/keystore.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace = "si.multai.companion"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "si.multai.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionProps.getProperty('versionCode').toInteger()
        versionName versionProps.getProperty('versionName')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [authScheme: 'multai-companion', linkHost: 'api.multai.si']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signing.getProperty('storeFile')) {
                storeFile new File(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signing.getProperty('storeFile') ? signingConfigs.release : null
        }
        // Test builds talk to a local service through `adb reverse` and install next to the release app.
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            manifestPlaceholders = [authScheme: 'multai-companion-dev', linkHost: 'localhost']
        }
    }
    // No dependency metadata blob inside the APK.
    dependenciesInfo { includeInApk = false; includeInBundle = false }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.contains('Release') } && !signing.getProperty('storeFile')) {
        throw new GradleException("Release signing key not found. Create it with apps/mobile/scripts/create-signing-key.sh (expected ${signingFile}).")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
